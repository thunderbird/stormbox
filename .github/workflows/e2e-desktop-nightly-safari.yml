name: e2e-desktop-nightly-safari

concurrency:
  group: e2e-desktop-nightly-safari
  cancel-in-progress: true

on:
  schedule:
    # run every day at 5:30am UTC
    - cron:  '30 5 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployed environment to test
        required: true
        default: prod
        type: choice
        options:
          - prod
          - stage

permissions:
  contents: read    # This is required for actions/checkout

jobs:
  desktop-nightly-safari:
    uses: ./.github/workflows/e2e-nightly-common.yml
    with:
      target_environment: ${{ inputs.target_environment || 'prod' }}
      job_name: ${{ format('{0}-desktop-nightly-safari', inputs.target_environment || 'prod') }}
      browserstack_build_name: "${{ format('Nightly Webmail E2E Tests (Desktop Safari, {0}): BUILD_INFO', inputs.target_environment || 'prod') }}"
      test_step_name: ${{ format('{0} E2E Tests on Desktop Safari', inputs.target_environment || 'prod') }}
      npm_script: e2e:browserstack:desktop:safari
    secrets:
      E2E_ACCTS_OIDC_EMAIL: ${{ secrets.E2E_ACCTS_OIDC_EMAIL }}
      E2E_ACCTS_OIDC_PWORD: ${{ secrets.E2E_ACCTS_OIDC_PWORD }}
      E2E_PRIMARY_THUNDERMAIL_EMAIL: ${{ secrets.E2E_PRIMARY_THUNDERMAIL_EMAIL }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
